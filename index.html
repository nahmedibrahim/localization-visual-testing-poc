<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Localization Visual Testing POC</title>
<style>
:root{font-family:Arial,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:1080px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-weight:700;font-size:20px}.locale,.sub{color:#687286}.card{background:#fff;border:1px solid #dfe4ec;border-radius:12px;padding:24px}h1{margin:0 0 8px;font-size:28px}.sub{margin-bottom:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.input{height:42px;border:1px solid #cfd6e2;border-radius:7px;padding:11px;background:#fafbfc}.summary{margin-top:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{border:1px solid #e1e6ee;border-radius:9px;padding:14px}.metric small{display:block;color:#6d7687;margin-bottom:6px}.metric strong{font-size:17px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:26px}button{min-width:120px;height:42px;border-radius:7px;border:1px solid #aeb7c5;padding:0 16px;background:#fff;font-weight:700;white-space:nowrap}.primary{background:#243b67;color:#fff;border-color:#243b67}.status{display:inline-flex;align-items:center;gap:7px;font-size:13px;padding:7px 10px;border:1px solid #cdd6e2;border-radius:999px;margin-top:18px}.dot{width:8px;height:8px;border-radius:50%;background:#4f7b59}.success{display:none;margin-top:18px;padding:12px 14px;border:1px solid #b9d7bf;border-radius:8px;background:#f4fbf5;font-weight:700}
.overflow .program-label{width:145px;height:18px;overflow:hidden;white-space:nowrap}.overflow .primary{width:150px;max-width:150px;overflow:hidden}
.rtl{direction:rtl}.rtl .field,.rtl .metric{text-align:right}
.rtl-broken{direction:rtl}.rtl-broken .field,.rtl-broken .metric{text-align:left}.rtl-broken header,.rtl-broken .actions{flex-direction:row}.rtl-broken .status{direction:ltr}
.language-control{display:flex;align-items:center;gap:8px}.language-control label{font-size:13px;color:#687286}.language-control select{height:38px;border:1px solid #cfd6e2;border-radius:7px;background:#fff;padding:0 10px;font-weight:700}@media(max-width:700px){.grid,.summary{grid-template-columns:1fr}}
</style></head>
<body><div class="shell" id="app">
<header><div class="brand" id="brand">Campus Portal</div><div class="locale" id="locale">English · en-US</div><div class="language-control" id="languageControl" style="display:none"><label for="languageSelector" id="languageSelectorLabel">Language</label><select id="languageSelector"><option value="en-US">English</option><option value="fr-FR">Français</option><option value="ar-SA">العربية</option><option value="es-ES">Español</option></select></div></header>
<main class="card"><h1 id="title">Student Registration</h1><div class="sub" id="subtitle">Review the registration details before continuing.</div>
<div class="grid">
<div class="field"><label id="nameLabel">Student name</label><div class="input" id="nameValue">Test Student</div></div>
<div class="field"><label class="program-label" id="programLabel">Academic program</label><div class="input" id="programValue">Computer Science</div></div>
<div class="field"><label id="termLabel">Academic term</label><div class="input" id="termValue">Fall 2026</div></div>
<div class="field"><label id="statusLabel">Registration status</label><div class="input" id="statusValue">Ready for review</div></div>
</div>
<div class="summary">
<div class="metric"><small id="dateLabel">Registration date</small><strong id="dateValue">09/14/2026</strong></div>
<div class="metric"><small id="creditsLabel">Credits</small><strong id="creditsValue">12.5</strong></div>
<div class="metric"><small id="feeLabel">Estimated fee</small><strong id="feeValue">$1,250.50</strong></div>
</div>
<div class="status"><span class="dot"></span><span id="ready">Page ready for visual validation</span></div>
<div id="successMessage" class="success">Registration submitted successfully</div>
<div class="actions"><button id="back">Back</button><button class="primary" id="continue">Continue</button></div>
</main></div>
<script>
const state=new URLSearchParams(location.search).get("state")||"baseline",app=document.getElementById("app");
const ar={brand:"بوابة الحرم الجامعي",locale:"العربية · ar-SA",title:"تسجيل الطالب",subtitle:"راجع تفاصيل التسجيل قبل المتابعة.",nameLabel:"اسم الطالب",nameValue:"طالب تجريبي",programLabel:"البرنامج الأكاديمي",programValue:"علوم الحاسب",termLabel:"الفصل الدراسي",termValue:"خريف 2026",statusLabel:"حالة التسجيل",statusValue:"جاهز للمراجعة",dateLabel:"تاريخ التسجيل",dateValue:"14/09/2026",creditsLabel:"الساعات المعتمدة",creditsValue:"12.5",feeLabel:"الرسوم التقديرية",feeValue:"1,250.50 ر.س",ready:"الصفحة جاهزة للتحقق البصري",back:"رجوع",continue:"متابعة"};
const set=(id,v)=>document.getElementById(id).textContent=v;
function arabic(){document.documentElement.lang="ar";document.documentElement.dir="rtl";Object.entries(ar).forEach(([k,v])=>set(k,v))}
if(state==="overflow"){app.classList.add("overflow");set("programLabel","Academic program and specialization selection for international students");set("continue","Continue and confirm registration changes")}
if(state==="rtl-good"){arabic();app.classList.add("rtl")}
if(state==="rtl-broken"){arabic();app.classList.add("rtl-broken")}
if(state==="functional-good"||state==="functional-broken"){document.getElementById("continue").addEventListener("click",()=>{if(state==="functional-good")document.getElementById("successMessage").style.display="block"})}
if(state==="date-en-good-1"){set("dateValue","09/14/2026")}
if(state==="date-en-good-2"){set("dateValue","12/24/2027")}
if(state==="date-en-broken"){set("dateValue","24/12/2027")}
if(state==="date-fr-good"){set("locale","Français · fr-FR");set("dateValue","24/12/2027")}
if(state==="date-fr-broken"){set("locale","Français · fr-FR");set("dateValue","12/24/2027")}

if(state==="locale-selection"){
 document.getElementById("locale").style.display="none";
 document.getElementById("languageControl").style.display="flex";
 const T={
 "en-US":["en","ltr","Campus Portal","Language","Student Registration","Review the registration details before continuing.","Student name","Test Student","Academic program","Computer Science","Academic term","Fall 2026","Registration status","Ready for review","Registration date","12/24/2027","Credits","12.5","Estimated fee","$1,250.50","Page ready for visual validation","Back","Continue"],
 "fr-FR":["fr","ltr","Portail du campus","Langue","Student Registration","Vérifiez les informations d’inscription avant de continuer.","Nom de l’étudiant","Étudiant test","Programme académique","Informatique","Période académique","Automne 2026","Statut de l’inscription","Prêt pour vérification","Date d’inscription","24/12/2027","Crédits","12,5","Frais estimés","1 250,50 €","Page prête pour la validation visuelle","Retour","Continue"],
 "ar-SA":["ar","rtl","بوابة الحرم الجامعي","اللغة","تسجيل الطالب","راجع تفاصيل التسجيل قبل المتابعة.","اسم الطالب","طالب تجريبي","Academic program","علوم الحاسب","الفصل الدراسي","خريف 2026","حالة التسجيل","جاهز للمراجعة","تاريخ التسجيل","2027/12/14","الساعات المعتمدة","12.5","الرسوم التقديرية","1,250.50 ر.س","الصفحة جاهزة للتحقق البصري","رجوع","متابعة"],
 "es-ES":["es","ltr","Portal del campus","Idioma","Inscripción del estudiante","Revise los detalles de inscripción antes de continuar.","Nombre del estudiante","Estudiante de prueba","Programa académico","Informática","Período académico","Otoño 2026","Estado de inscripción","Listo para revisión","Fecha de inscripción","24/12/2027","Créditos","12,5","Tarifa estimada","1.250,50 €","Página lista para validación visual","Atrás","Continuar"]};
 const ids=["brand","languageSelectorLabel","title","subtitle","nameLabel","nameValue","programLabel","programValue","termLabel","termValue","statusLabel","statusValue","dateLabel","dateValue","creditsLabel","creditsValue","feeLabel","feeValue","ready","back","continue"];
 function applyLocale(code){const x=T[code]||T["en-US"];document.documentElement.lang=x[0];document.documentElement.dir=x[1];app.classList.remove("rtl","rtl-broken");if(x[1]==="rtl")app.classList.add("rtl");ids.forEach((id,i)=>set(id,x[i+2]));localStorage.setItem("pocLocale",code);}
 const s=document.getElementById("languageSelector"),saved=localStorage.getItem("pocLocale");if(saved&&T[saved])s.value=saved;applyLocale(s.value);s.addEventListener("change",()=>applyLocale(s.value));
}

</script></body></html>
